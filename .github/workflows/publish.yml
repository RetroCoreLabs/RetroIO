name: publish
on:
  push:
    tags: [ 'v*' ]
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: version from tag
        shell: pwsh
        run: echo "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV
      - run: dotnet pack -c Release -nodeReuse:false -o packages -p:VersionPrefix=${{ env.VERSION }}
      - run: dotnet nuget push packages\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
