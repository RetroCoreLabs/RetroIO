name: build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore RetroIO.sln
      - run: dotnet build RetroIO.sln -c Release --no-restore -warnaserror -nodeReuse:false
      - run: dotnet test RetroIO.sln -c Release --no-build -nodeReuse:false --filter "Category!=Azure&Category!=ExternalTNFSD&Category!=RealNetwork&Category!=Manual&Category!=ProcessSpawn"
