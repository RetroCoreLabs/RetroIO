# Demo Switch C — DNIC 2352 (hosts the echo service)
# Trunk from B on 2202; access port for the echo service on 2203.

[switch]
name = Switch-C
dnic = 2352
mgmt_port = 9103
monitor_port = 4003
mgmt_addr = 23520000

# Trunk toward B (B connects in).
[port.0]
type = trunk
transport = xot
mode = dce
host = 0.0.0.0
port = 2202
peer_name = Switch-B
peer_monitor_host = 127.0.0.1
peer_monitor_port = 4002
peer_mgmt_addr = 23510000

# Access port the echo service connects to.
[port.1]
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 2203

# Calls for our own DNIC 2352 go to the local access port (echo).
[route.0]
type = dnic
dnic = 2352
port = 1

# Everything else goes back toward B.
[route.1]
type = default
port = 0

# Management login for the in-band NMC (matches the x25nmc console default).
[user.0]
name = admin
password = admin
level = 1
